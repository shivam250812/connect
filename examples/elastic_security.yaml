# Elastic Security: detection alerts, read straight from the alerts index in Elasticsearch
# (works with the free 14-day Elastic Cloud trial or self-hosted)
# Login: API key (Authorization: ApiKey <encoded key>) · Paging: from/size in the POST body · Incremental: @timestamp
#
# Before uploading:
#   1. Replace base_url with your Elasticsearch endpoint (Elastic Cloud: deployment -> Elasticsearch -> Copy endpoint).
#   2. Kibana -> Stack Management -> API keys -> Create API key. Copy the "Encoded" value.
#   3. Secrets tab: save it as elastic_api_key.
id: elastic-security
name: Elastic Security alerts
description: Detection alerts raised by Elastic Security rules
source: elastic
entity: event
schedule: {every: 5m}
auth: {type: bearer, scheme: ApiKey, secret: elastic_api_key}
request:
  base_url: https://YOUR-DEPLOYMENT.YOUR-REGION.gcp.cloud.es.io
  path: /.alerts-security.alerts-default/_search
  method: POST
  params: {ignore_unavailable: "true"}   # no alerts yet -> empty result instead of index_not_found
  body:
    sort: [{"@timestamp": {order: asc}}]
    query: {range: {"@timestamp": {gte: "now-1d"}}}
pagination:
  type: offset
  params_in: body
  offset_param: from
  page_size_param: size
  page_size: 100
  total_path: hits.total.value
  max_pages: 50                  # Elasticsearch caps from+size at 10,000
cursor: {field: "_source['@timestamp']", param: "query.range.@timestamp.gte", in: body, initial: -1d}
records: hits.hits
rate_limit: {requests_per_second: 2, burst: 2}
mapping:
  id: _id
  type: "_source['kibana.alert.rule.name']"
  severity: {from: "_source['kibana.alert.severity']", lower: true}
  timestamp: "_source['@timestamp']"
  description: {from: "_source['kibana.alert.reason']", default: "Elastic alert"}
  score: "_source['kibana.alert.risk_score']"
  user: "_source['user.name']"
  src_ip: "_source['source.ip']"
  dst_ip: "_source['destination.ip']"
  dst_port: "_source['destination.port']"
  action: "_source['event.action']"
  outcome: "_source['event.outcome']"
  product: {const: Elastic Security}

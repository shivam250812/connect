# Prisma Cloud (CSPM) — alerts.
# Login: POST /login with access key + secret -> JWT -> header x-redlock-auth · Paging: nextPageToken
id: prisma-cloud
name: Prisma Cloud alerts
source: prisma
entity: event
schedule: {every: 15m}
allowed_hosts: [api.prismacloud.io]
auth:
  type: token_exchange
  header: x-redlock-auth
  scheme: ""
  login:
    url: https://api.prismacloud.io/login
    json: {username: "${secret:prisma_access_key_id}", password: "${secret:prisma_secret_key}"}
    token_path: token
    ttl_seconds: 540
request: {base_url: "https://api.prismacloud.io", path: /v2/alert, params: {timeType: relative, timeAmount: 24, timeUnit: hour, detailed: "true"}}
pagination: {type: next_token, token_path: nextPageToken, token_param: pageToken, page_size_param: limit, page_size: 100}
records: items
mapping:
  id: id
  type: {template: "cspm_{policy.name}"}
  severity: {from: riskDetail.rating, lower: true}
  timestamp: alertTime
  description: {template: "{policy.name} on {resource.name} ({resource.accountName})"}
  user: {from: "history[0].modifiedBy", default: ""}

# Sophos Firewall — traffic events via Web Admin REST API.
# Login: API key in header · Paging: offset / limit · -> events
id: sophos-firewall
name: Sophos Firewall events (REST)
source: sophos_fw
entity: event
schedule: {every: 5m}
allowed_hosts: [firewall.example.com]
auth: {type: api_key, header: X-API-Key, secret: sophos_fw_api_key}
request:
  base_url: https://firewall.example.com
  path: /api/v1/traffic-logs
pagination: {type: offset, offset_param: offset, page_size_param: limit, page_size: 100}
records: items
mapping:
  id: log_id
  type: {template: "sophos_fw_{log_subtype}", lower: true}
  severity: {from: severity, lower: true, default: info}
  timestamp: timestamp
  description: {template: "{log_subtype} {fw_rule_name} {src_ip} -> {dst_ip}:{dst_port}"}
  src_ip: src_ip
  dst_ip: dst_ip
  dst_port: dst_port
  action: log_subtype

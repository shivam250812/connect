# Digital Guardian (ARC) — export API for an alert export profile.
# Login: OAuth2 client credentials · Paging: none (export profile returns new rows; rows are positional arrays)
# Map columns by POSITION ([0], [1], ...) in the order defined in your export profile.
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: digital-guardian
name: Digital Guardian alerts
source: digital_guardian
entity: event
schedule: {every: 10m}
allowed_hosts: [accessgateway.example.com, arc.example.com]
auth:
  type: oauth2_client_credentials
  token_url: https://accessgateway.example.com/connect/token
  client_id: YOUR_CLIENT_ID
  secret: dg_client_secret
  client_auth: body
  scope: client
request: {base_url: "https://arc.example.com", path: /rest/1.0/export/YOUR_EXPORT_PROFILE_ID}
records: data
mapping:
  id: "[0]"
  type: {template: "dlp_{[1]}"}
  timestamp: "[2]"
  user: "[3]"
  description: "[4]"

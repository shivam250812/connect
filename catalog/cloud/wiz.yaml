# Wiz — issues via GraphQL.
# Login: OAuth2 client credentials with audience=wiz-api (credentials in body) · Paging: GraphQL cursor at variables.after
# Use your tenant's API endpoint (Settings > Tenant), e.g. api.us17.app.wiz.io.
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: wiz-issues
name: Wiz issues
source: wiz
entity: event
schedule: {every: 15m}
allowed_hosts: [auth.app.wiz.io, api.us17.app.wiz.io]
auth:
  type: oauth2_client_credentials
  token_url: https://auth.app.wiz.io/oauth/token
  client_id: YOUR_CLIENT_ID
  secret: wiz_client_secret
  client_auth: body
  extra: {audience: wiz-api}
request:
  base_url: https://api.us17.app.wiz.io
  path: /graphql
  method: POST
  body:
    query: "query IssuesTable($first: Int, $after: String) { issues: issuesV2(first: $first, after: $after) { nodes { id severity status createdAt sourceRule { name } entitySnapshot { name type } } pageInfo { hasNextPage endCursor } } }"
    variables: {first: 100}
pagination: {type: next_token, token_path: data.issues.pageInfo.endCursor, token_param: variables.after, token_in: body, has_more_path: data.issues.pageInfo.hasNextPage, max_pages: 50}
records: data.issues.nodes
mapping:
  id: id
  type: {template: "cloud_issue: {sourceRule.name}"}
  severity: {from: severity, lower: true}
  timestamp: createdAt
  description: {template: "{sourceRule.name} on {entitySnapshot.type} {entitySnapshot.name}"}
  outcome: {from: status, lower: true}

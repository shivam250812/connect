# Trellix EDR — threats.
# Login: OAuth2 client credentials (Trellix IAM) · Paging: JSON:API links.next
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: trellix-edr
name: Trellix EDR threats
source: trellix_edr
entity: event
schedule: {every: 10m}
auth:
  type: oauth2_client_credentials
  token_url: https://iam.mcafee-cloud.com/iam/v1.0/token
  client_id: YOUR_CLIENT_ID
  secret: trellix_client_secret
  scope: "soc.hts.c soc.hts.r soc.rts.c soc.rts.r soc.qry.pr soc.cop.r"
  extra: {audience: mcafee}
request: {base_url: "https://api.manage.trellix.com", path: /edr/v2/threats, params: {"page[limit]": 100}}
pagination: {type: next_url, token_path: links.next}
records: data
mapping:
  id: id
  type: attributes.name
  severity: attributes.severity
  timestamp: attributes.firstDetected
  description: {template: "{attributes.name} ({attributes.type})"}

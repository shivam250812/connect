# Sophos Intercept X (Sophos Central) — SIEM alerts.
# Login: OAuth2 client credentials (credentials in body) -> whoami DISCOVERY -> region host + X-Tenant-ID · Paging: cursor + has_more
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: sophos-central-alerts
name: Sophos Central alerts
source: sophos
entity: event
schedule: {every: 5m}
allowed_hosts: [id.sophos.com, api.central.sophos.com, "*.central.sophos.com"]
auth:
  type: oauth2_client_credentials
  token_url: https://id.sophos.com/api/v2/oauth2/token
  client_id: YOUR_CLIENT_ID
  secret: sophos_client_secret
  client_auth: body
  scope: token
  discover: {url: "https://api.central.sophos.com/whoami/v1", base_url_path: apiHosts.dataRegion, headers: {X-Tenant-ID: id}}
request: {base_url: "https://api.central.sophos.com", path: /siem/v1/alerts}
pagination: {type: next_token, token_path: next_cursor, token_param: cursor, has_more_path: has_more, page_size_param: limit, page_size: 1000}
cursor: {field: when, param: from_date, format: epoch, initial: -23h}   # Sophos accepts at most 24 h back
records: items
mapping:
  id: id
  type: type
  severity: severity
  timestamp: when
  description: description
  product: location

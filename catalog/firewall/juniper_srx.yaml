# Juniper SRX — RT_FLOW structured syslog (set security log mode stream format sd-syslog).
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: juniper-srx-syslog
name: Juniper SRX (syslog RT_FLOW)
source: juniper_srx
entity: event
kind: file
schedule: {every: 15s}
file:
  path: data/feeds/syslog.log
  format: regex
  filter: RT_FLOW
  pattern: '^<\d+>1 (?P<ts>\S+) (?P<host>\S+) RT_FLOW - (?P<event>RT_FLOW_SESSION_\w+) .*?source-address="(?P<src>[^"]+)" source-port="(?P<sport>\d+)" destination-address="(?P<dst>[^"]+)" destination-port="(?P<dport>\d+)"'
mapping:
  id: {template: "{host}-{ts}-{src}:{sport}"}
  type: {from: event, map: {RT_FLOW_SESSION_DENY: traffic_denied, RT_FLOW_SESSION_CREATE: traffic_allowed, RT_FLOW_SESSION_CLOSE: session_closed}}
  severity: {from: event, map: {RT_FLOW_SESSION_DENY: medium}, map_default: info}
  timestamp: ts
  description: {template: "{event} {src} -> {dst}:{dport}"}
  src_ip: src
  dst_ip: dst
  dst_port: dport

# GitHub REST API — global security advisories (real API, free).
# Login: Personal access token (Bearer) · Paging: Link header (cursor) · -> events
# Token: github.com/settings/tokens -> fine-grained token, no extra permissions needed for public advisories.
id: github-advisories
name: GitHub Security Advisories
description: Reviewed security advisories across open-source ecosystems
source: github
entity: event
schedule: {every: 15m}
auth:
  type: bearer
  secret: github_token
request:
  base_url: https://api.github.com
  path: /advisories
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
  params: {type: reviewed, sort: updated, direction: desc}
pagination: {type: link_header, page_size_param: per_page, page_size: 100, max_pages: 3}
rate_limit: {requests_per_second: 1, burst: 2}
mapping:
  id: ghsa_id
  type: {const: advisory}
  severity: {from: severity, lower: true, default: unknown}
  score: cvss.score
  timestamp: published_at
  description: summary
  cve: cve_id
  product: "vulnerabilities[0].package.name"
  url: html_url

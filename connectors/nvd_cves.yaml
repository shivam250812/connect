# NIST NVD CVE API 2.0 (real API, free).
# Login: optional API key in the `apiKey` header · Paging: offset (startIndex) · Incremental by lastModified · -> events
# Works without a key (5 requests / 30 s); a free key from nvd.nist.gov/developers raises it to 50 / 30 s.
id: nvd-cves
name: NVD CVE feed
description: CVEs added or changed since the last run
source: nvd
entity: event
schedule: {every: 2h}
auth:
  type: api_key
  header: apiKey
  secret: nvd_api_key
  optional: true
request:
  base_url: https://services.nvd.nist.gov
  path: /rest/json/cves/2.0
  timeout_seconds: 60
pagination:
  type: offset
  offset_param: startIndex
  page_size_param: resultsPerPage
  page_size: 200
  total_path: totalResults
  max_pages: 5
cursor:
  field: cve.lastModified
  param: lastModStartDate
  end_param: lastModEndDate
  initial: -6h
  format: iso_z
records: vulnerabilities
rate_limit: {requests_per_second: 0.15, burst: 2}
retry: {max_attempts: 4, base_delay_seconds: 6}
mapping:
  id: cve.id
  type: {const: cve}
  severity: {from: "cve.metrics.cvssMetricV31[0].cvssData.baseSeverity", lower: true, default: unknown}
  score: "cve.metrics.cvssMetricV31[0].cvssData.baseScore"
  timestamp: cve.published
  description: "cve.descriptions[0].value"
  cve: cve.id
  url: {template: "https://nvd.nist.gov/vuln/detail/{cve.id}"}

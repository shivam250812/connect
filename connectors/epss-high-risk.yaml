# FIRST EPSS — Exploit Prediction Scoring System (real API, free, no account) -> events
# Which CVEs are most likely to be exploited in the next 30 days. Only those with EPSS > 0.9.
# Login: none · Paging: offset (offset / limit, stops at `total`) · Entity: event
id: epss-high-risk
name: FIRST EPSS — likely-exploited CVEs
description: CVEs with a >90% predicted chance of exploitation in the next 30 days
source: epss
entity: event
schedule: {every: 1d}            # EPSS scores are published once a day
request:
  base_url: https://api.first.org
  path: /data/v1/epss
  params: {epss-gt: 0.9}
  timeout_seconds: 30
pagination:
  type: offset
  offset_param: offset
  page_size_param: limit
  page_size: 100
  total_path: total
  max_pages: 15
records: data
rate_limit: {requests_per_second: 2, burst: 2}
mapping:
  id: cve
  type: {const: exploit_prediction}
  severity: {const: critical}
  score: epss
  timestamp: date
  description: {template: "EPSS {epss}: exploitation likely within 30 days (percentile {percentile})"}
  cve: cve
  url: {template: "https://api.first.org/data/v1/epss?cve={cve}"}

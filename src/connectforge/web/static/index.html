<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConnectForge</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="product" href="/">ConnectForge</a>
      <nav id="nav">
        <a data-view="connections" class="on">Connections</a>
        <a data-view="users">Users</a>
        <a data-view="devices">Devices</a>
        <a data-view="events">Events</a>
        <a data-view="records">Other records</a>
        <a data-view="quarantine">Quarantine</a>
        <a data-view="alerts">Notifications</a>
        <a data-view="secrets">Secrets</a>
        <a data-view="audit">Audit log</a>
      </nav>
      <span id="updated" class="muted small"></span>
      <span id="whoami" class="whoami"></span>
    </div>
  </header>
  <div id="auth" class="auth hidden"></div>

  <main>
    <div id="load-errors"></div>
    <section id="view"></section>
  </main>

  <aside id="drawer" class="drawer hidden" aria-label="Connection details">
    <div class="drawer-head">
      <div>
        <div id="drawer-title" class="drawer-title"></div>
        <div id="drawer-sub" class="muted small"></div>
      </div>
      <button class="btn" data-close>Close</button>
    </div>
    <div id="drawer-actions" class="actions"></div>
    <div id="drawer-tabs" class="subnav"></div>
    <div id="drawer-body"></div>
  </aside>

  <div id="add" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="add-title">Add connector</h2>
        <button class="btn" data-close>Close</button>
      </div>
      <div class="modal-tools">
        <div class="seg"><button data-mode="form" class="on">Form</button><button data-mode="yaml">YAML</button></div>
        <label class="btn" for="yaml-file">Upload file</label><input id="yaml-file" type="file" accept=".yaml,.yml" hidden>
        <select id="example-pick"><option value="">Start from a template</option></select>
      </div>
      <div id="mode-form"></div>
      <div id="mode-yaml" class="hidden"><textarea id="yaml" spellcheck="false" aria-label="Connector YAML"></textarea></div>
      <div class="actions">
        <button class="btn" id="btn-validate">Validate</button>
        <button class="btn" id="btn-test">Test connection</button>
        <button class="btn" id="btn-preview">Preview</button>
        <button class="btn primary" id="btn-save">Save</button>
      </div>
      <div id="add-out"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>

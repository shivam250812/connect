# Cloudflare account audit logs (free tier) -> events
# Who changed what: zone/DNS config changes, logins, API token changes, firewall rules.
# Login: Bearer API token · Paging: page number (page / per_page) · Incremental: `since`
#
# Setup (~2 min):
#   1. dash.cloudflare.com -> My Profile -> API Tokens -> Create Token -> Custom token
#      Permissions: Account · Account Settings · Read   (this covers audit logs)
#   2. Copy your Account ID (dashboard right sidebar on any zone, or the URL after dash.cloudflare.com/)
#      and replace YOUR_ACCOUNT_ID below (it is not a secret).
#   3. Store the token:  Secrets tab -> cloudflare_token  (or: cli set-secret cloudflare_token)
id: cloudflare-audit
name: Cloudflare audit logs
source: cloudflare
auth:
  type: bearer
  secret: cloudflare_token
request:
  base_url: https://api.cloudflare.com
rate_limit:
  requests_per_second: 2
  burst: 4
endpoints:
- name: audit_logs
  title: Cloudflare audit logs
  entity: event
  path: /client/v4/accounts/YOUR_ACCOUNT_ID/audit_logs
  params:
    direction: desc
  records: result
  pagination:
    type: page_number
    page_param: page
    page_size_param: per_page
    page_size: 50
    max_pages: 10
  cursor:
    field: when
    param: since
    initial: -7d
    format: iso_z
  mapping:
    id: id
    type:
      template: cloudflare_{action.type}
    action: action.type
    outcome:
      from: action.result
      map:
        'True': success
        'False': failure
      map_default: unknown
    severity:
      from: action.type
      map:
        login: low
        delete: high
        purge: medium
        rotate: medium
      map_default: info
    timestamp: when
    user: actor.email
    src_ip: actor.ip
    description:
      template: '{actor.email} {action.type} {resource.type} {resource.id}'
    product:
      template: cloudflare {interface}
  description: Account and zone configuration changes, logins and token activity
  schedule:
    every: 15m

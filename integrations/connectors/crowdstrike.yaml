# CrowdStrike Falcon (US-2 cloud) -> devices, events and records. One API client.
# Login: OAuth2 client credentials (sent in the body); API client needs Hosts: Read, Alerts: Read, Host groups: Read.
# Not on US-2? Change both hosts: api.crowdstrike.com, api.eu-1.crowdstrike.com, api.laggar.gcw.crowdstrike.com
id: crowdstrike
name: CrowdStrike Falcon
source: crowdstrike
auth:
  type: oauth2_client_credentials
  token_url: https://api.us-2.crowdstrike.com/oauth2/token
  client_id: 9871c7d6f7da40c1bd7d709e716f6a66
  secret: crowdstrike_client_secret        # Secrets tab (or your secret manager), never in the file
  client_auth: body
request:
  base_url: https://api.us-2.crowdstrike.com
endpoints:
  - name: hosts
    title: Hosts
    entity: device
    path: /devices/combined/devices/v1     # full host details; /devices/queries/devices/v1 returns only IDs
    params: {sort: "last_seen.desc"}
    schedule: {every: 15m}
    pagination: {type: next_token, token_path: meta.pagination.offset, token_param: offset, page_size_param: limit, page_size: 100, max_pages: 50}
    records: resources

  - name: alerts
    title: Detections and alerts
    entity: event
    path: /alerts/combined/alerts/v1
    method: POST
    body: {limit: 500, sort: "created_timestamp.asc"}
    schedule: {every: 5m}
    pagination: {type: next_token, token_path: meta.pagination.after, token_param: after, token_in: body}
    cursor: {field: created_timestamp, param: filter, in: body, initial: -1d, format: iso_z, template: "created_timestamp:>'{value}'"}
    records: resources
    mapping:
      id: composite_id
      type: {from: name, default: falcon_alert}
      severity: {from: severity_name, lower: true, default: unknown}
      timestamp: created_timestamp
      description: {from: description, default: "Falcon alert"}
      user: user_name
      product: {template: "Falcon {product}"}

  - name: host-groups
    title: Host groups
    enabled: false   # the API client needs "Host groups: Read" (Falcon: API clients and keys); then set true
    entity: record
    path: /devices/combined/host-groups/v1
    schedule: {every: 1d}
    pagination: {type: offset, offset_param: offset, page_size_param: limit, page_size: 100, total_path: meta.pagination.total, max_pages: 10}
    records: resources
    mapping:
      id: id
      title: name
      timestamp: modified_timestamp
      group_type: group_type
      description: description
      rule: assignment_rule

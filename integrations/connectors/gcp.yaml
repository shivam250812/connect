# Google Cloud Audit Logs (real API) -> events. One service account (Secrets tab: gcp_service_account_json).
# Login: service-account JSON key -> signed RS256 JWT -> access token · Paging: pageToken
id: gcp
name: Google Cloud
source: google_cloud
allowed_hosts: [logging.googleapis.com, oauth2.googleapis.com]
auth:
  type: google_service_account
  secret: gcp_service_account_json
  scope: "https://www.googleapis.com/auth/cloud-platform"
request:
  base_url: "https://logging.googleapis.com"
schedule: {every: 15m}
pagination: {type: next_token, params_in: body, token_path: nextPageToken, token_param: pageToken}
endpoints:
  - name: audit
    title: Audit logs
    entity: event
    path: /v2/entries:list
    method: POST
    body: {resourceNames: ["projects/tutorial-sheets-430416"], pageSize: 100, orderBy: "timestamp desc"}
    records: entries
    mapping: &audit_mapping
      id: insertId
      type: {from: "protoPayload.@type", default: "gcp_audit_log"}
      severity: {from: severity, lower: true, default: info}
      timestamp: timestamp
      description: {from: protoPayload.methodName, default: "GCP API Call"}
      user: {from: protoPayload.authenticationInfo.principalEmail, default: ""}
      src_ip: {from: protoPayload.requestMetadata.callerIp, default: ""}

  - name: iam-changes
    title: IAM permission changes
    description: Who granted or removed access (SetIamPolicy) on the project
    entity: event
    path: /v2/entries:list
    method: POST
    body:
      resourceNames: ["projects/tutorial-sheets-430416"]
      filter: 'protoPayload.methodName:"SetIamPolicy"'
      pageSize: 100
      orderBy: "timestamp desc"
    records: entries
    mapping: *audit_mapping

  - name: errors
    title: Errors and above
    description: Log entries with severity ERROR or worse
    entity: event
    path: /v2/entries:list
    method: POST
    body:
      resourceNames: ["projects/tutorial-sheets-430416"]
      filter: "severity>=ERROR"
      pageSize: 100
      orderBy: "timestamp desc"
    records: entries
    mapping: *audit_mapping

# FIRST EPSS (real API, free, no account) -> events
# Exploit Prediction Scoring System: chance a CVE is exploited in the next 30 days. Login: none · Paging: offset
id: first
name: FIRST EPSS
source: epss
request:
  base_url: https://api.first.org
  timeout_seconds: 30
rate_limit: {requests_per_second: 2, burst: 2}
endpoints:
  - name: epss
    title: Likely-exploited CVEs (EPSS > 0.9)
    description: CVEs with a >90% predicted chance of exploitation in the next 30 days
    entity: event
    path: /data/v1/epss
    params: {epss-gt: 0.9}
    schedule: {every: 1d}            # EPSS scores are published once a day
    pagination: {type: offset, offset_param: offset, page_size_param: limit, page_size: 100, total_path: total, max_pages: 15}
    records: data
    mapping:
      id: cve
      type: {const: exploit_prediction}
      severity: {const: critical}
      score: epss
      timestamp: date
      description: {template: "EPSS {epss}: exploitation likely within 30 days (percentile {percentile})"}
      cve: cve
      url: {template: "https://api.first.org/data/v1/epss?cve={cve}"}

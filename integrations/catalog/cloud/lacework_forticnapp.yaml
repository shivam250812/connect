# Lacework FortiCNAPP — alerts.
# Login: POST /api/v2/access/tokens with key ID + secret (X-LW-UAKS header) -> bearer token · Paging: next-page URL
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: lacework-alerts
name: Lacework FortiCNAPP alerts
source: lacework
auth:
  type: token_exchange
  login:
    url: https://youraccount.lacework.net/api/v2/access/tokens
    headers:
      X-LW-UAKS: ${secret:lacework_secret}
    json:
      keyId: YOUR_KEY_ID
      expiryTime: 3600
    token_path: token
    ttl_seconds: 3500
request:
  base_url: https://youraccount.lacework.net
endpoints:
- name: alerts
  title: Lacework FortiCNAPP alerts
  entity: event
  path: /api/v2/Alerts
  records: data
  pagination:
    type: next_url
    token_path: paging.urls.nextPage
  cursor:
    field: startTime
    param: startTime
    end_param: endTime
    initial: -1d
    format: iso_z
  mapping:
    id:
      from: alertId
      type: str
    type: alertType
    severity:
      from: severity
      lower: true
    timestamp: startTime
    description: alertName
  schedule:
    every: 15m

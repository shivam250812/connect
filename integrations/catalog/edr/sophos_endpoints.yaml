# Sophos Central — protected computers/servers -> DEVICES table.
# Login: OAuth2 client credentials (credentials in body) -> whoami DISCOVERY -> region host + X-Tenant-ID · Paging: pageFromKey
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: sophos-central-endpoints
name: Sophos Central endpoints
source: sophos
allowed_hosts:
- id.sophos.com
- api.central.sophos.com
- '*.central.sophos.com'
auth:
  type: oauth2_client_credentials
  token_url: https://id.sophos.com/api/v2/oauth2/token
  client_id: YOUR_CLIENT_ID
  secret: sophos_client_secret
  client_auth: body
  scope: token
  discover:
    url: https://api.central.sophos.com/whoami/v1
    base_url_path: apiHosts.dataRegion
    headers:
      X-Tenant-ID: id
request:
  base_url: https://api.central.sophos.com
endpoints:
- name: endpoints
  title: Sophos Central endpoints
  entity: device
  path: /endpoint/v1/endpoints
  params:
    pageTotal: 'true'
  records: items
  pagination:
    type: next_token
    token_path: pages.nextKey
    token_param: pageFromKey
    page_size_param: pageSize
    page_size: 500
  mapping:
    id: id
    hostname: hostname
    ip: ipv4Addresses[0]
    os:
      template: '{os.name} {os.majorVersion}.{os.minorVersion}'
    owner: associatedPerson.viaLogin
    last_seen: lastSeenAt
    status: health.overall
  schedule:
    every: 1h

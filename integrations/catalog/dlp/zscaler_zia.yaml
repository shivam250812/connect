# Zscaler (ZIA) — users. (DLP incidents themselves are delivered by Zscaler NSS feeds -> syslog.)
# Login: obfuscated API key + username/password -> SESSION COOKIE (JSESSIONID) · Paging: page / pageSize
# Status: TEMPLATE — written from the vendor's public API docs; verify endpoint, fields and permissions
#         against your tenant (Test connection + Dry-run preview) before relying on it.
id: zscaler-zia-users
name: Zscaler ZIA users
source: zscaler
auth:
  type: token_exchange
  login:
    url: https://zsapi.zscaler.net/api/v1/authenticatedSession
    json:
      apiKey: ${zscaler_key:zscaler_api_key}
      username: admin@yourcompany.com
      password: ${secret:zscaler_password}
      timestamp: ${now_ms}
    token_from: cookie
    token_path: JSESSIONID
    ttl_seconds: 1500
request:
  base_url: https://zsapi.zscaler.net
endpoints:
- name: users
  title: Zscaler ZIA users
  entity: user
  path: /api/v1/users
  pagination:
    type: page_number
    page_param: page
    page_size_param: pageSize
    page_size: 500
  mapping:
    id:
      from: id
      type: str
    name: name
    email: email
    department: department.name
    status:
      from: deleted
      map:
        'True': deleted
        'False': active
  schedule:
    every: 1h

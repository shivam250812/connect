# Cisco Secure Firewall Management Center (FMC) — managed firewall devices.
# Login: basic auth on generatetoken -> token in response header · Paging: offset / limit
id: cisco-fmc-devices
name: Cisco FMC devices
source: cisco_fmc
allowed_hosts:
- fmc.example.com
auth:
  type: token_exchange
  header: X-auth-access-token
  scheme: ''
  login:
    url: https://fmc.example.com/api/fmc_platform/v1/auth/generatetoken
    basic_username: fmc-api-user
    basic_password: ${secret:fmc_password}
    token_from: header
    token_path: X-auth-access-token
    ttl_seconds: 1700
request:
  base_url: https://fmc.example.com
endpoints:
- name: devicerecords
  title: Cisco FMC devices
  entity: device
  path: /api/fmc_config/v1/domain/default/devices/devicerecords
  params:
    expanded: 'true'
  records: items
  pagination:
    type: offset
    offset_param: offset
    page_size_param: limit
    page_size: 100
    total_path: paging.count
  mapping:
    id: id
    hostname: name
    ip:
      from: ipv4.static.address
      default: 0.0.0.0
    os:
      template: FTD {model} {sw_version}
    status:
      from: healthStatus
      lower: true
  schedule:
    every: 1h

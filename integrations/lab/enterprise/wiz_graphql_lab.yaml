# LAB — OAuth2 with `audience` + GraphQL with a nested cursor (Wiz pattern).
id: lab-wiz-issues
name: "Wiz-style issues (GraphQL)"
source: wiz_lab
entity: event
schedule: {every: 15m}
auth:
  type: oauth2_client_credentials
  token_url: http://127.0.0.1:9100/oauth/token
  client_id: lab-client-id
  secret: oauth_lab_client_secret
  client_auth: body
  extra: {audience: wiz-api}
request:
  base_url: http://127.0.0.1:9100/wiz
  path: /graphql
  method: POST
  body:
    query: "query IssuesTable($first: Int, $after: String) { issues: issuesV2(first: $first, after: $after) { nodes { id severity status createdAt sourceRule { name } entitySnapshot { name type } } pageInfo { hasNextPage endCursor } } }"
    variables: {first: 50}
pagination: {type: next_token, token_path: data.issues.pageInfo.endCursor, token_param: variables.after, token_in: body, has_more_path: data.issues.pageInfo.hasNextPage}
records: data.issues.nodes
mapping:
  id: id
  type: {template: "cloud_issue: {sourceRule.name}"}
  severity: {from: severity, lower: true}
  timestamp: createdAt
  description: {template: "{sourceRule.name} on {entitySnapshot.type} {entitySnapshot.name}"}
  outcome: {from: status, lower: true}
